# Configuration settings for HGAN - Lipson Pendulum Real Data
# Note: Use 1/0 for boolean variables

[video]
# How many frames do we generate for each of the real/fake videos?
# ('K' in MocoGAN paper figure 2)
generator_frames = 30

# How many consecutive frames do we inspect for each of the real/fake input videos?
# ('T' in MocoGAN paper figure 2)
# Should be <= <generator_frames>
discriminator_frames = 16

# How many real video frames do we generate for each system before sampling
# Not applicable for Lipson dataset (using pre-recorded data)
real_total_frames = 30

# Convert to values between -1 and +1 ?
normalize = 0

[paths]
# base wrt which all input/output folders are determined
# For Lipson pendulum, input is the location of invar_datasets.zip
input = /home/jiayinliu/Desktop/Experiment/LowDimConditionalHGan/hamiltonian-nn/experiment-real
output = /home/jiayinliu/Desktop/Experiment/LowDimConditionalHGan/ControlledHamiltonianGAN_11/src/hgan/output/lipson_pendulum_real

[experiment]

# Default GPU ID to use. Leave blank to use CPU.
gpu = 0

# System name - not used for Lipson dataset
system_name = 
# Are the physical properties of the system constant? - not used for Lipson
system_physics_constant = 1
# Are the colors of the system constant? - not used for Lipson
system_color_constant = 1
# Does the system have friction? - not used for Lipson
system_friction = 0

# One of gru/hnn_simple/hnn_phase_space/hnn_mass
architecture = hnn_phase_space

n_epoch = 50000
batch_size = 32
cyclic_coord_loss = 0.0
learning_rate = 0.0001
betas = 0.5, 0.999

# Gamma for regularization of GAN loss
# see https://arxiv.org/pdf/1801.04406v4.pdf, Eq (9)
# Set 0 for no regularization
r1_gamma = 10

# we print diagnostics after every print_every epochs
print_every = 50
# we save trained models every save_model_every epochs
save_model_every = 500
# we save real videos every save_real_video_every epochs
save_real_video_every = 500
# we save fake videos every save_fake_video_every epochs
save_fake_video_every = 500
# compare true and fake data
make_comparison_every = 500
make_tsne_every = 5000
# we calculate fvd distance (expensive operation) every calculate_fvd_every epochs
calculate_fvd_every = 1000000

seed = 42
retrain = 1

# Specify wandb API Key (from https://wandb.ai/authorize) if using wandb, otherwise leave blank
wandb_api_key =

# One of 'dm'/'hgn'/'lipson'/<blank>
rt_data_generator = lipson

# Lipson-specific settings
lipson_experiment = pend-real
lipson_data_dir = /home/jiayinliu/Desktop/Experiment/LowDimConditionalHGan/hamiltonian-nn/experiment-real

# Model dimensions
img_size = 32
hidden_size = 100
# Dimension of epsilon (q, p) vector - 2 for single pendulum
ndim_epsilon = 20
# Dimension of content vector for discriminator
ndim_content = 50
# NO labels for unconditional training
ndim_label = 0
# NO colors for trajectory data
ndim_color = 0
# NO physical properties for unconditional training
ndim_physics = 0
# Number of channels (not used for trajectory data, but kept for compatibility)
ndim_channel = 3
# Number of Discriminator filters
ndim_discriminator_filter = 32
# Number of Generator filters
ndim_generator_filter = 32
# Number of TrajectoryGenerator hiddenlayer
ndim_generator_hiddenlayer = 256
ndim_discriminator_hiddenlayer = 128
# maximum dimension of all system - 1 particle for pendulum
max_n = 1

# Multiplication factor (~1.0) applied to generator loss for fake data
generator_gamma = 1.0
# Multiplication factor (~1.0) applied to discriminator loss for real data
discriminator_gamma = 1.0

[test]
# A section purely for testing purposes

astring = lipson_pendulum
abool = 0
aint = 42
amissing =
